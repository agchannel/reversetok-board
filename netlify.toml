# 현황판 배포 설정 (빌드 없음, 저장소 루트의 index.html 그대로 배포)
[build]
  publish = "."

# 봇 코드·도구 폴더는 웹에 노출하지 않음
[[redirects]]
  from = "/bot/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
